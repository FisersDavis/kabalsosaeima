name: Saeima Thursday Sync & Deploy

on:
  push:
    branches: ["main"] # Automatically deploy on new commits
  schedule:
    # Runs every Thursday at 19:00 UTC (22:00 Riga time) after Saeima plenary sittings
    - cron: '0 19 * * 4'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch and verify Saeima votes
        id: sync_step
        run: |
          python scripts/ingest_real_saeima.py
          python scripts/sentinel_check.py --mode integrity --update-metadata

      - name: Alert on Failure (Create GitHub Issue & Email)
        if: failure() && steps.sync_step.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPORT="🚨 **Saeimas balsojumu sinhronizācija vai integritātes pārbaude neizdevās**\n\nDarba plūsma: [Skatīt darbību žurnālu](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\nCommit: ${{ github.sha }}\n"
          if [ -f alert_report.md ]; then
            REPORT=$(cat alert_report.md)
            REPORT="$REPORT\n\n[🔍 Pārbaudīt GitHub Action žurnālu](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          fi
          
          # Check if an alert issue is already open to avoid spam
          EXISTING_ISSUE=$(gh issue list --state open --label "automated-alert" --json number -q '.[0].number' 2>/dev/null || true)
          if [ -z "$EXISTING_ISSUE" ]; then
            gh issue create \
              --title "🚨 Datu kļūda: Saeimas sinhronizācija neizdevās" \
              --body "$REPORT" \
              --label "bug,automated-alert"
          else
            gh issue comment "$EXISTING_ISSUE" --body "⚠️ Atkārtota sinhronizācijas kļūda: $REPORT"
          fi

      - name: Auto-close resolved alert issues (if successful)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING_ISSUE=$(gh issue list --state open --label "automated-alert" --json number -q '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING_ISSUE" ]; then
            gh issue close "$EXISTING_ISSUE" --comment "✅ Problēma atrisināta automātiski nākamajā sinhronizācijas reizē. Visi integritātes testi sekmīgi nokārtoti."
          fi

      - name: Commit updated datasets & metadata (if any)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Saeima Bot"
          git add public/data/*.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): auto-sync Saeima voting records [skip ci]" && git push)

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

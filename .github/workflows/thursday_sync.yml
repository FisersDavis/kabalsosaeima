name: Saeima Thursday Sync & Deploy

on:
  schedule:
    # Runs every Thursday at 19:00 UTC (22:00 Riga time) after Saeima plenary sittings
    - cron: '0 19 * * 4'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch latest Saeima votes
        run: |
          python scripts/fetch_saeima_votes.py

      - name: Commit updated datasets (if any)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Saeima Bot"
          git add public/data/*.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): auto-sync Saeima voting records" && git push)

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
